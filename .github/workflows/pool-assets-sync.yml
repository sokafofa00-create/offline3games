name: Pool assets sync (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: pool-assets-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify all manifest assets
        run: |
          set -euo pipefail
          CDN="https://game-assets-prod.platocdn.com"
          MANIFEST="com.plato.android/files/g/7c5d2aa05094dbee8753108c59f617b2f4b1e7ae/game/__assets.json"
          grep -oE '"[^"]+":"[0-9a-f]{40}"' "$MANIFEST" | tr -d '"' | sed 's/:/ /' > /tmp/manifest.tsv
          echo "entries: $(wc -l < /tmp/manifest.tsv)"
          download_one() {
            key="$1"; sha="$2"
            f="pool_assets/$key"
            if [ -f "$f" ] && [ "$(sha1sum "$f" | cut -d' ' -f1)" = "$sha" ]; then return 0; fi
            mkdir -p "$(dirname "$f")"
            for try in 1 2 3 4; do
              if curl -fsS --retry 2 --connect-timeout 20 "$CDN/$sha" -o "$f.tmp" \
                 && [ "$(sha1sum "$f.tmp" | cut -d' ' -f1)" = "$sha" ]; then
                mv "$f.tmp" "$f"; return 0
              fi
              sleep 2
            done
            echo "FAILED $key" >&2; return 1
          }
          export -f download_one
          export CDN
          xargs -P 16 -L 1 bash -c 'download_one "$@"' _ < /tmp/manifest.tsv
          echo "present: $(find pool_assets/pool -type f | wc -l)"

      - name: Sync full manifest into bundle dir
        run: cp "com.plato.android/files/g/7c5d2aa05094dbee8753108c59f617b2f4b1e7ae/game/__assets.json" pool_assets/__assets.json

      - name: Verify asset bundle
        run: node tests/verify-assets.mjs pool_assets

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pool_assets
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Pool: complete dynamic asset set (5077 files, SHA-1 verified)"
          git push origin HEAD:main
