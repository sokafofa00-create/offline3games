name: Web Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - "tests/**"
      - ".github/workflows/web-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run smoke test (load, start, input, menu, rematch)
        run: node tests/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots/*.png
          retention-days: 14
      - name: Publish screenshots to ci-shots branch (for viewing)
        if: always()
        run: |
          set -e
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp -r shots /tmp/shots-out
          git checkout --orphan ci-shots
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p shots && cp /tmp/shots-out/*.png shots/
          { echo "# Smoke screenshots"; echo; for f in shots/*.png; do echo "- $f"; done; } > README.md
          git add shots README.md
          git commit -m "smoke screenshots for run ${GITHUB_RUN_NUMBER}"
          git push -f origin ci-shots
