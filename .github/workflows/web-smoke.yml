name: Web Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - "tests/**"
      - ".github/workflows/web-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Verify Match Monsters named assets (presence and SHA-1 against __assets.json)
        run: node tests/verify-assets.mjs match_monsters_assets
      - name: Verify Brawlbots named assets (presence and SHA-1 against __assets.json)
        run: node tests/verify-assets.mjs brawlbots_assets
      - name: Verify Pool named assets (presence and SHA-1 against __assets.json)
        run: node tests/verify-assets.mjs pool_assets
      - name: Run smoke test (load, start, input, menu, rematch)
        run: node tests/smoke.mjs
      - name: Computer-player test (bot seat acts by itself; internal-API human seat)
        if: always()
        run: node tests/bots-test.mjs
      - name: Pool bot test (vs computer)
        if: always()
        run: mkdir -p shots && node tests/pool-bot-test.mjs
      - name: LAN lobby protocol test (two browser contexts, relay stand-in)
        if: always()
        run: mkdir -p shots && node tests/lobby-test.mjs
      - name: LAN match test (two contexts, relay stand-in)
        if: always()
        run: mkdir -p shots && node tests/lan-match-test.mjs
      - name: Renderer comparison (Mesa GL via Xvfb, same scenarios)
        if: always()
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri >/dev/null
          BACKEND=gl SHOT_DIR=shots-gl SCEN=pool-8ball,brawlbots-2p,monsters-normal xvfb-run -a node tests/smoke.mjs || true
      - name: Real-control end-of-match probe (menu, resign, game over, rematch)
        if: always()
        run: |
          mkdir -p shots-end
          node tests/endgame.mjs 2>&1 | grep -E "ENDGAME|Error" | cut -c1-60000 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            shots/*.png
            shots-gl/*.png
            shots-end/*.png
          retention-days: 14
      - name: Publish screenshots to ci-shots branch (for viewing)
        if: always()
        run: |
          set -e
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp -r shots /tmp/shots-out; mkdir -p /tmp/shots-end-out; cp shots-end/*.png /tmp/shots-end-out/ 2>/dev/null || true; mkdir -p /tmp/shots-gl-out; cp shots-gl/*.png /tmp/shots-gl-out/ 2>/dev/null || true
          git checkout --orphan ci-shots
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p shots shots-gl shots-end && (cp /tmp/shots-end-out/*.png shots-end/ 2>/dev/null || true) && cp /tmp/shots-out/*.png shots/ && (cp /tmp/shots-gl-out/*.png shots-gl/ 2>/dev/null || true)
          { echo "# Smoke screenshots"; echo; for f in shots/*.png; do echo "- $f"; done; } > README.md
          git add shots shots-gl shots-end README.md
          git commit -m "smoke screenshots for run ${GITHUB_RUN_NUMBER}"
          git push -f origin ci-shots
