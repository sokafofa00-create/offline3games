name: Bisect APK variants

on:
  push:
    branches: [ "bisect-ci" ]
  workflow_dispatch:

jobs:
  variant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a1-2b20daf-pinned-v1v2
            ref: 2b20daf18dc4702169705d3d8ca7003a219786b8
            v1: "true"
          - name: a2-2b20daf-pinned-v2only
            ref: 2b20daf18dc4702169705d3d8ca7003a219786b8
            v1: "false"
          - name: b-slim-pinned-v1v2
            ref: 2d67af1c425d4a7c5c024b58c72a3c744466866a
            v1: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install pinned debug keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          echo "" | base64 -d > /tmp/pinned.ks
      - name: Build debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon
      - name: Re-sign with apksigner (explicit v1/v2)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/in.apk
          $BT/apksigner sign --ks /tmp/pinned.ks --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --min-sdk-version 21 --v1-signing-enabled ${{ matrix.v1 }} --v2-signing-enabled true --out /tmp/out.apk /tmp/in.apk
          $BT/apksigner verify -v --print-certs /tmp/out.apk | grep -E "Verifies|Verified using|SHA-256 digest" | head -8
          $BT/aapt2 dump badging /tmp/out.apk | head -3
          unzip -l /tmp/out.apk | tail -1
          sha256sum /tmp/out.apk
          stat -c %s /tmp/out.apk
          mv /tmp/out.apk "/tmp/offline3games-${{ matrix.name }}.apk"
      - name: Publish under bisect tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          T="bisect-${{ matrix.name }}"
          gh release delete "$T" -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$T" "/tmp/offline3games-${{ matrix.name }}.apk" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$T" --notes "Bisect variant ${{ matrix.name }}, source ref ${{ matrix.ref }}. sha256 $(sha256sum /tmp/offline3games-${{ matrix.name }}.apk | cut -d' ' -f1)"
