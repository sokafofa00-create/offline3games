name: Texture Probe
on:
  workflow_dispatch:
  push:
    paths:
      - "tests/tex-probe.mjs"
      - ".github/workflows/tex-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - run: node tests/tex-probe.mjs
