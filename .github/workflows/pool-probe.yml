name: Pool probe (system Chrome)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pool-probe.yml"
      - "tests/pool-probe.mjs"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chrome
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chrome
      - name: Probe
        run: mkdir -p shots && node --import ./tests/chrome-shim.mjs tests/pool-probe.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-probe-shots
          path: shots/*.png
