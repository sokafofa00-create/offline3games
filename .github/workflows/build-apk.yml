name: Build Offline Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Offline Debug & Release APKs
        working-directory: ./android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify Zero Internet Permission in Merged Manifest
        working-directory: ./android
        run: |
          MANIFESTS=$(find app/build/intermediates -name "AndroidManifest.xml")
          if [ -z "$MANIFESTS" ]; then
            echo "ERROR: Could not locate merged AndroidManifest.xml"
            exit 1
          fi
          for f in $MANIFESTS; do
            if grep -q "android.permission.INTERNET" "$f"; then
              echo "ERROR: INTERNET permission detected in $f!"
              exit 1
            fi
          done
          echo "Verified: APK is 100% offline with zero network permissions and zero pairip."

      - name: Verify packaged APKs (permissions, forbidden libraries, signature)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          FAIL=0
          {
            echo "## Packaged APK verification"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk; do
            echo "=== $apk"
            echo "### $apk" >> "$GITHUB_STEP_SUMMARY"
            echo "size: $(stat -c %s "$apk") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            PERMS=$($BT/aapt2 dump permissions "$apk")
            echo "$PERMS"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "$PERMS" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            for p in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.ACCESS_WIFI_STATE; do
              if echo "$PERMS" | grep -q "$p"; then echo "FORBIDDEN permission $p in $apk"; FAIL=1; fi
            done
            rm -rf /tmp/apkx && mkdir /tmp/apkx && unzip -q "$apk" -d /tmp/apkx
            if grep -r -a -l -i -E "pairip|firebase|crashlytics|com/google/android/gms|play-core|licensecheck" /tmp/apkx --include="*.dex" --include="AndroidManifest.xml" --include="*.json" -s | head -3 | grep .; then
              echo "FORBIDDEN library marker found in $apk"; FAIL=1
            else
              echo "no pairip/firebase/crashlytics/gms markers in dex/manifest/json"
            fi
            SIG=$($BT/apksigner verify --verbose --print-certs "$apk" 2>&1 | grep -E "Verifies|Verified using|certificate DN|Number of signers" | sed 's/SHA-256 digest.*//')
            echo "$SIG"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "$SIG" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$SIG" | grep -q "Verifies" || { echo "APK signature did not verify: $apk"; FAIL=1; }
          done
          echo "overall_fail=$FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: Offline-3Games-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish latest test build as a private pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then echo "Skipping publish: $GITHUB_SHA is not main head $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/offline3games-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/offline3games-release.apk
          gh release delete latest-test -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-test /tmp/offline3games-debug.apk /tmp/offline3games-release.apk \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build ($GITHUB_SHA)" \
            --notes "Debug-key signed test build from commit $GITHUB_SHA (run $GITHUB_RUN_ID). debug sha256 $(sha256sum /tmp/offline3games-debug.apk | cut -d' ' -f1). release sha256 $(sha256sum /tmp/offline3games-release.apk | cut -d' ' -f1). Install the debug APK on a phone for direct testing. Not a store release."
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/latest-test" >> "$GITHUB_STEP_SUMMARY"
