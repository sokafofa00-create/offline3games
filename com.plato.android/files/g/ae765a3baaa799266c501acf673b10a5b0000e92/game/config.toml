[[weapon_explosives]]
# Flurry of Paws: DoT cloud. `damage`/`range` are the PER-TICK AoE (WPFlurryPaws re-ticks every RETICK_STEPS for
# ~4s); blast 0 (no repeated knockback), dig 0 (a cloud, not a crater). Values are a first pass; retune freely.
name = "flurry-of-paws"
sprite = "~/imported/2snfnyss4m16i.webp"
projectile = true
mass = 2
material = "proj_explosive"
radius = 14
damping = 0.05
angular_damping = 0.1
# Impact does NO direct damage (0). A range-based blast falls off toward the edges (stronger at the centre); all
# damage instead comes from the paw-cloud DoT (flat per tick), so it's uniform across the whole cloud area.
damage = 0
range = 110
dig = 0
blast = 0
recoil = 4
rotation_based_on_velocity = true
starting_rotation = 0
basis = "flurry-of-paws"
puid = 3023

