<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>الألعاب الجماعية أوفلاين</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- شاشة إعدادات اللعبة واللاعبين (Launcher / Setup) -->
  <div id="setup-screen" class="screen active">
    <div class="setup-card mode-hotseat" id="setup-card">
      <header class="brand-header">
        <div class="brand-badge">OFFLINE PASS &amp; PLAY</div>
        <h1>صالة الألعاب المحلية</h1>
        <p>العب مع صديقك على نفس الهاتف — بدون إنترنت 100%</p>
      </header>

      <!-- تبويبات الألعاب الثلاث -->
      <div class="game-selector" id="game-selector">
        <button type="button" class="game-tab selected" data-game="pool">
          <span class="game-icon">🎱</span>
          <span class="game-title">البلياردو</span>
          <span class="game-tag ready">جاهزة</span>
        </button>
        <button type="button" class="game-tab" data-game="monsters">
          <span class="game-icon">👾</span>
          <span class="game-title">Match Monsters</span>
          <span class="game-tag">متوفرة</span>
        </button>
        <button type="button" class="game-tab" data-game="brawlbots">
          <span class="game-icon">🤖</span>
          <span class="game-title">Brawlbots</span>
          <span class="game-tag">متوفرة</span>
        </button>
      </div>

      <!-- إعدادات البلياردو -->
      <div id="pool-options" class="options-panel">
        <div class="field-group">
          <label for="pool-gametype">نوع اللعبة وعدد اللاعبين</label>
          <select id="pool-gametype">
            <option value="0" selected>8-Ball (لاعب ضد لاعب — 1v1)</option>
            <option value="3">9-Ball (لاعب ضد لاعب — 1v1)</option>
            <option value="6">Cutthroat (تحدي 3 لاعبين على نفس الهاتف)</option>
            <option value="1">8-Ball فرق (4 لاعبين — 2v2)</option>
            <option value="4">9-Ball فرق (4 لاعبين — 2v2)</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="pool-live">نظام الوقت</label>
            <select id="pool-live">
              <option value="0" selected>مفتوح بدون عدّاد (مريح)</option>
              <option value="1">مؤقت حماسي (30 ثانية)</option>
            </select>
          </div>
          <div class="field-group">
            <label for="pool-scoring">نظام الاحتساب</label>
            <select id="pool-scoring">
              <option value="0" selected>عادي (كلاسيكي)</option>
              <option value="1">Trickshot (نقاط استعراضية)</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="pool-break">ضربة الكسر الأولى</label>
            <select id="pool-break">
              <option value="2" selected>عشوائي</option>
              <option value="0">اللاعب 1</option>
              <option value="1">اللاعب 2</option>
            </select>
          </div>
          <div class="field-group">
            <label for="app-lang">لغة داخل اللعبة</label>
            <select id="app-lang">
              <option value="ar" selected>العربية</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>

      <!-- إعدادات Match Monsters -->
      <div id="monsters-options" class="options-panel hidden">
        <div class="field-row">
          <div class="field-group">
            <label for="mm-rules">قواعد اللعب</label>
            <select id="mm-rules">
              <option value="0" selected>قياسي (Normal)</option>
              <option value="1">حركات إضافية (Free Moves)</option>
            </select>
          </div>
          <div class="field-group">
            <label for="mm-live">نظام الوقت</label>
            <select id="mm-live">
              <option value="0" selected>مفتوح بدون عدّاد</option>
              <option value="1">مؤقت مباشر</option>
            </select>
          </div>
        </div>
      </div>

      <!-- إعدادات Brawlbots -->
      <div id="brawlbots-options" class="options-panel hidden">
        <div class="field-group">
          <label for="bb-players">عدد اللاعبين على الهاتف</label>
          <select id="bb-players">
            <option value="0" selected>لاعبان (1 ضد 1)</option>
            <option value="1">3 لاعبين (الكل ضد الكل)</option>
            <option value="2">4 لاعبين (الكل ضد الكل)</option>
            <option value="3">4 لاعبين فرق (2 ضد 2)</option>
          </select>
        </div>
      </div>

      <!-- أوضاع اللعب الثلاثة -->
      <div class="mode-tabs" id="mode-tabs">
        <button type="button" class="mode-tab selected" data-mode="hotseat">نفس الجهاز</button>
        <button type="button" class="mode-tab" data-mode="lan">الشبكة المحلية</button>
        <button type="button" class="mode-tab" data-mode="bot">ضد الكمبيوتر</button>
      </div>
      <input type="hidden" id="play-mode" value="hotseat" />
      <div class="field-group hidden" id="difficulty-box">
        <label for="bot-difficulty">مستوى صعوبة الكمبيوتر</label>
        <select id="bot-difficulty">
          <option value="easy">سهل</option>
          <option value="medium" selected>متوسط</option>
          <option value="hard">صعب</option>
        </select>
      </div>

      <!-- لوبي الشبكة المحلية -->
      <div id="lobby-panel" class="lobby-panel">
        <div class="lobby-head"><span class="lobby-dot"></span><span id="lobby-me">...</span><span id="lobby-count" class="lobby-count"></span></div>
        <div id="lobby-players" class="lobby-players"></div>
        <div id="lobby-chat" class="lobby-chat"></div>
        <div id="lobby-games-menu" class="lobby-games-menu hidden">
          <button type="button" data-lobby-game="pool">🎱 البلياردو</button>
          <button type="button" data-lobby-game="monsters">👾 Match Monsters</button>
          <button type="button" data-lobby-game="brawlbots">🤖 Brawlbots</button>
        </div>
        <div class="lobby-bar">
          <button type="button" id="lobby-games-btn" class="lobby-plus" aria-label="إنشاء مباراة">＋</button>
          <input type="text" id="lobby-input" maxlength="200" placeholder="اكتب رسالة…" autocomplete="off" />
          <button type="button" id="lobby-send" class="lobby-sendbtn">إرسال</button>
        </div>
      </div>

      <!-- أسماء اللاعبين على نفس الهاتف -->
      <div class="players-box">
        <div class="players-label">أسماء اللاعبين على نفس الجهاز</div>
        <div class="players-grid" id="players-grid">
          <div class="player-input-wrap seat-0">
            <span class="seat-dot">1</span>
            <input type="text" id="p1-name" value="اللاعب 1" maxlength="16" placeholder="اللاعب 1" />
          </div>
          <div class="player-input-wrap seat-1">
            <span class="seat-dot">2</span>
            <input type="text" id="p2-name" value="اللاعب 2" maxlength="16" placeholder="اللاعب 2" />
          </div>
          <div class="player-input-wrap seat-2 hidden" id="p3-wrap">
            <span class="seat-dot">3</span>
            <input type="text" id="p3-name" value="اللاعب 3" maxlength="16" placeholder="اللاعب 3" />
          </div>
          <div class="player-input-wrap seat-3 hidden" id="p4-wrap">
            <span class="seat-dot">4</span>
            <input type="text" id="p4-name" value="اللاعب 4" maxlength="16" placeholder="اللاعب 4" />
          </div>
        </div>
      </div>

      <button type="button" id="start-btn" class="primary-btn">
        ابدأ المباراة الآن
      </button>

      <div id="loading-box" class="loading-box hidden">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="loading-text">جارٍ تحضير ملفات اللعبة محلياً...</span>
      </div>
    </div>
  </div>

  <!-- شاشة اللعب الفعلي (WebGL Surface + Top Pass-and-Play HUD) -->
  <div id="game-screen" class="screen">
    <div id="top-hud" class="top-hud">
      <button type="button" id="menu-btn" class="hud-icon-btn" aria-label="القائمة">☰</button>

      <div class="turn-pill" id="turn-pill">
        <span class="turn-dot" id="turn-dot"></span>
        <span id="turn-text">دور: اللاعب 1</span>
      </div>

      <div class="hud-right-actions">
        <button type="button" id="switch-seat-btn" class="hud-chip-btn hidden" title="تبديل اللاعب في الطور المتزامن">تبديل اللاعب ⇄</button>
        <button type="button" id="mute-btn" class="hud-icon-btn" aria-label="الصوت">🔊</button>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- غطاء تمرير الهاتف: يخفي اللوحة بين اللاعبين في الألعاب ذات المعلومات المخفية -->
    <div id="pass-cover" class="pass-cover hidden" role="dialog" aria-live="assertive">
      <div class="pass-cover-box">
        <div id="pass-cover-dot" class="pass-cover-dot"></div>
        <div id="pass-cover-title" class="pass-cover-title"></div>
        <div class="pass-cover-sub">مرّر الهاتف ثم اضغط عندما تكون جاهزاً</div>
        <button type="button" id="pass-cover-btn" class="rematch-btn">أنا جاهز</button>
      </div>
    </div>

    <!-- شريط إعادة اللعب السريع عند انتهاء المباراة -->
    <div id="gameover-bar" class="gameover-bar hidden">
      <button type="button" id="rematch-btn" class="rematch-btn">🔄 مباراة جديدة بنفس الإعدادات</button>
      <button type="button" id="back-setup-btn" class="secondary-btn">⚙️ الإعدادات</button>
    </div>

    <!-- القائمة المنسدلة داخل اللعبة -->
    <div id="menu-backdrop" class="menu-backdrop hidden">
      <div class="menu-sheet">
        <div class="menu-header">
          <span>قائمة اللعبة</span>
          <button type="button" id="close-menu-btn" class="close-sheet-btn">✕</button>
        </div>
        <div id="game-menu-items" class="menu-list"></div>
        <hr class="menu-divider" />
        <div class="menu-list">
          <button type="button" id="menu-rematch-btn" class="menu-item accent">🔄 إعادة المباراة من البداية</button>
          <button type="button" id="menu-exit-btn" class="menu-item danger">🏠 الخروج لشاشة اختيار الألعاب</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
